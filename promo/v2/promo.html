<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Nunito;src:url(../../app/src/main/res/font/nunito_regular.ttf);font-weight:400}
@font-face{font-family:Nunito;src:url(../../app/src/main/res/font/nunito_bold.ttf);font-weight:700}
@font-face{font-family:Nunito;src:url(../../app/src/main/res/font/nunito_extrabold.ttf);font-weight:800}
html,body{margin:0;padding:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Nunito,sans-serif;background:linear-gradient(180deg,#EAF3FF 0%,#F6F4FF 55%,#FFF3DA 100%)}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.blob{border-radius:50%}
#night{position:absolute;inset:0;background:linear-gradient(180deg,#14112A 0%,#1E1A3D 60%,#2A2150 100%);opacity:0}
.star{position:absolute;width:26px;height:26px}
.star svg{width:100%;height:100%}
#caption{position:absolute;left:60px;right:60px;top:118px;text-align:center}
#capTitle{font-weight:800;font-size:80px;line-height:1.08;color:#0B3D7A;letter-spacing:-0.5px}
#capSub{font-weight:700;font-size:40px;line-height:1.3;color:#4B5872;margin-top:18px}
#phone{position:absolute;left:213px;top:452px;width:653px;height:1411px;border-radius:78px;background:#16171C;box-shadow:0 40px 90px rgba(17,40,90,.28),0 8px 24px rgba(17,40,90,.18),inset 0 0 0 3px #2B2D35}
#screen{position:absolute;left:16px;top:16px;width:621px;height:1379px;border-radius:62px;overflow:hidden;background:#F8FAFF}
#screen img{position:absolute;left:0;top:0;width:621px;display:none;transform-origin:50% 50%}
#punch{position:absolute;left:50%;top:22px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#0B0C10;box-shadow:inset 0 0 0 3px #1C1E25;z-index:20}
#status{position:absolute;left:0;top:0;width:621px;height:59px;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 40px 0 46px;box-sizing:border-box;font-weight:700;font-size:25px;color:#1F2A37}
#status svg{height:24px;fill:currentColor}
#status .icons{display:flex;gap:9px;align-items:center}
#tapDot{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(255,255,255,.55);border:4px solid rgba(8,106,216,.85);box-shadow:0 6px 18px rgba(8,106,216,.35);z-index:30;opacity:0}
#tapRing{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:5px solid rgba(8,106,216,.7);z-index:29;opacity:0}
.cardIcon{position:absolute;width:300px;height:300px;border-radius:76px;background:#fff;box-shadow:0 26px 60px rgba(17,40,90,.22);display:flex;align-items:center;justify-content:center}
.cardIcon img{width:268px;height:268px}
.bigTitle{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;font-size:92px;color:#0B3D7A;letter-spacing:-1px}
.tagline{position:absolute;left:0;width:1080px;text-align:center;font-weight:700;font-size:44px;color:#4B5872}
#pills{position:absolute;left:0;width:1080px;display:flex;justify-content:center;gap:18px}
.pill{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;padding:18px 28px;font-weight:800;font-size:34px;color:#0B3D7A;box-shadow:0 10px 26px rgba(17,40,90,.12)}
.pill svg{width:34px;height:34px;fill:#086AD8}
#cta{position:absolute;left:50%;width:640px;margin-left:-320px;height:120px;border-radius:999px;background:#FFB020;color:#3A2800;font-weight:800;font-size:46px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 8px 0 #D68A00,0 20px 40px rgba(214,138,0,.35)}
.conf{position:absolute;width:18px;height:28px;border-radius:5px;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="blobs"></div>
  <div id="night"></div>
  <div id="stars"></div>

  <div id="intro" class="abs" style="width:1080px;height:1920px">
    <div class="cardIcon" id="introIcon" style="left:390px;top:560px"><img src="../../app/src/main/ic_launcher-playstore.png"></div>
    <div class="bigTitle" id="introTitle" style="top:930px">Children Books</div>
    <div class="tagline" id="introTag" style="top:1050px">Read &middot; Listen &middot; Learn</div>
  </div>

  <div id="caption"><div id="capTitle"></div><div id="capSub"></div></div>

  <div id="phone">
    <div id="screen">
      <img id="home_scroll" src="screens/home_scroll.jpg">
      <img id="home_status" src="screens/home_status.jpg">
      <img id="home_dock" src="screens/home_dock.jpg">
      <img id="s19" src="screens/19_worldmap.jpg">
      <img id="s03" src="screens/03_lesson_a.jpg">
      <img id="s04" src="screens/04_lesson_b.jpg">
      <img id="s05" src="screens/05_practice.jpg">
      <img id="s06" src="screens/06_practice_correct.jpg">
      <img id="s07" src="screens/07_practice_tryagain.jpg">
      <img id="s08" src="screens/08_reward.jpg">
      <img id="s11" src="screens/11_stickers.jpg">
      <img id="s12" src="screens/12_listen.jpg">
      <img id="s13" src="screens/13_bedtime.jpg">
      <img id="s14" src="screens/14_play.jpg">
      <img id="s15" src="screens/15_game.jpg">
      <img id="s16" src="screens/16_game_correct.jpg">
      <img id="s17" src="screens/17_gate.jpg">
      <img id="s18" src="screens/18_report.jpg">
      <div id="status"><span>9:41</span><span class="icons">
        <svg viewBox="0 0 24 24"><path d="M12 21l11.5-14.3C23.1 6.4 18.6 3 12 3S.9 6.4.5 6.7L12 21z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M2 22h20V2L2 22z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </span></div>
      <div id="tapRing"></div><div id="tapDot"></div>
    </div>
    <div id="punch"></div>
  </div>

  <div id="end" class="abs" style="width:1080px;height:1920px">
    <div class="cardIcon" id="endIcon" style="left:390px;top:430px"><img src="../../app/src/main/ic_launcher-playstore.png"></div>
    <div class="bigTitle" id="endTitle" style="top:800px">Children Books</div>
    <div class="tagline" id="endTag" style="top:920px">Letters, numbers and words for ages 3&ndash;8</div>
    <div id="pills" style="top:1060px">
      <div class="pill" id="p1"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z"/></svg>No ads</div>
      <div class="pill" id="p2"><svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46C10.21 6.23 11.08 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3 0 1.13-.64 2.11-1.56 2.62l1.45 1.45C23.16 18.16 24 16.68 24 15c0-2.64-2.05-4.78-4.65-4.96zM3 5.27l2.75 2.74C2.56 8.15 0 10.77 0 14c0 3.31 2.69 6 6 6h11.73l2 2L21 20.73 4.27 4 3 5.27zM7.73 10l8 8H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h1.73z"/></svg>Works offline</div>
      <div class="pill" id="p3"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>Kid safe</div>
    </div>
    <div id="cta" style="top:1250px">Free on Google Play</div>
  </div>
  <div id="confetti"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const lerp = (a,b,p) => a + (b-a)*p;
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOutCubic = p => 1 - Math.pow(1-p,3);
const eInCubic = p => p*p*p;
const eInOut = p => p<.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
const eOutBack = p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
const eOutBackSoft = p => { const c1=0.55, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
const K = 621/699;                  // screenshot px -> screen px
const SW = 621, SH = 1379;

// ---------- seeded random ----------
let seed = 12345; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;

// ---------- background blobs and stars ----------
const blobs = [
  {x:90,y:300,r:170,c:'rgba(8,106,216,.08)'}, {x:980,y:220,r:120,c:'rgba(255,176,32,.20)'},
  {x:1000,y:900,r:200,c:'rgba(124,92,252,.08)'}, {x:60,y:1100,r:140,c:'rgba(255,120,150,.12)'},
  {x:920,y:1650,r:180,c:'rgba(8,106,216,.07)'}, {x:150,y:1760,r:160,c:'rgba(255,176,32,.18)'},
  {x:540,y:60,r:110,c:'rgba(70,190,140,.10)'}, {x:1040,y:1300,r:90,c:'rgba(70,190,140,.12)'}
].map((b,i)=>{ const d=document.createElement('div'); d.className='abs blob';
  d.style.width=d.style.height=(b.r*2)+'px'; d.style.background=b.c; $('blobs').appendChild(d); return {...b,el:d,ph:i*1.3}; });
const starSvg = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
const stars = [[120,520],[960,480],[70,880],[1010,1180],[110,1460],[980,1560],[540,1880],[300,240],[800,330]].map((p,i)=>{
  const d=document.createElement('div'); d.className='star'; d.innerHTML=starSvg; d.style.left=p[0]+'px'; d.style.top=p[1]+'px';
  $('stars').appendChild(d); return {el:d, ph:i*0.9, x:p[0], y:p[1]}; });

// ---------- confetti ----------
const palette = ['#086AD8','#FFB020','#FF6B8B','#4CC38A','#7C5CFC','#36B5F0'];
function makeBurst(t0, ox, oy, n){ const parts=[]; for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='conf';
  d.style.background=palette[i%palette.length]; if(i%3==0){d.style.borderRadius='50%'; d.style.height='18px';}
  $('confetti').appendChild(d);
  const ang = -Math.PI/2 + (rnd()-0.5)*Math.PI*1.25, sp = 700 + rnd()*900;
  parts.push({el:d,t0,ox,oy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,rot:rnd()*360,vr:(rnd()-.5)*900}); } return parts; }
const bursts = [...makeBurst(14.15, 540, 880, 70), ...makeBurst(30.05, 540, 600, 80)];

// ---------- captions ----------
const captions = [
  {a:2.35, b:5.85, t:'7 learning worlds', s:'Letters, numbers, time, colours and more'},
  {a:6.25, b:9.85, t:'Short lessons,<br>read aloud', s:'Five friendly cards at a time'},
  {a:10.25,b:13.85, t:'Practice with<br>gentle hints', s:'No buzzers. Just “Try again!”'},
  {a:14.25,b:17.85, t:'Earn stars<br>and stickers', s:'24 stickers to collect'},
  {a:18.25,b:21.85, t:'Stories, rhymes<br>and sounds', s:'Plus a calm Bedtime mode'},
  {a:22.25,b:25.85, t:'12 learning games', s:'Match, trace, spell and more'},
  {a:26.25,b:29.6,  t:'A corner for<br>grown-ups', s:'Progress report behind a parent check'},
];
let lastCap = -1;

// ---------- taps (screenshot px coordinates) ----------
const taps = [
  {t:5.0,  x:186, y:376},   // Letters world
  {t:5.95, x:147, y:641},   // A to E node
  {t:7.85, x:530, y:1416},  // Next
  {t:11.4, x:510, y:631},   // Bee
  {t:19.7, x:538, y:129},   // Bedtime
  {t:23.6, x:186, y:646},   // Letter Match
  {t:25.0, x:168, y:1081},  // a
  {t:27.55,x:165, y:984},   // 78
];

const imgs = {}; document.querySelectorAll('#screen img').forEach(i=>imgs[i.id]=i);

function show(id, x=0, y=0, o=1, s=1, z=1){
  const el = imgs[id]; el.style.display='block'; el.style.opacity=o; el.style.zIndex=z;
  el.style.transform = `translate(${x}px,${y}px) scale(${s})`;
}
// push: new slides in from right over old
function push(t, a, oldId, newId, dur=0.42){
  const p = eOutCubic(prog(t,a,a+dur));
  if (p < 1) show(oldId, -0.28*SW*p, 0, 1 - 0.35*p, 1, 1);
  show(newId, SW*(1-p), 0, 1, 1, 2);
}
function fade(t, a, oldId, newId, dur=0.22){
  const p = prog(t,a,a+dur);
  if (p < 1) show(oldId, 0, 0, 1, 1, 1);
  show(newId, 0, 0, p, 1, 2);
}

function renderScreen(t){
  for (const k in imgs) imgs[k].style.display='none';
  let statusDark = false;
  if (t < 5.25){
    // Home, then scroll down to the worlds
    const s = 661*eInOut(prog(t, 3.55, 4.65));
    show('home_scroll', 0, -s*K, 1, 1, 1);
    show('home_status', 0, 0, 1, 1, 3);
    show('home_dock', 0, 1298*K, 1, 1, 3);
    if (t >= 5.2) {}
  } else if (t < 6.2){
    const p = eOutCubic(prog(t,5.2,5.62));
    if (p<1){ show('home_scroll', -0.28*SW*p, -661*K, 1-0.35*p,1,1); show('home_status',-0.28*SW*p,0,1-0.35*p,1,1); show('home_dock',-0.28*SW*p,1298*K,1-0.35*p,1,1); }
    show('s19', SW*(1-p), 0, 1, 1, 4);
  } else if (t < 8.0){
    push(t, 6.15, 's19', 's03');
  } else if (t < 10.2){
    push(t, 8.0, 's03', 's04', 0.38);
  } else if (t < 11.55){
    push(t, 10.15, 's04', 's05');
  } else if (t < 12.55){
    fade(t, 11.55, 's05', 's06', 0.18);
  } else if (t < 14.1){
    push(t, 12.55, 's06', 's07');
  } else if (t < 16.3){
    const p = eOutBack(prog(t,14.05,14.6));
    if (t < 14.2) show('s07', 0, 0, 1 - prog(t,14.05,14.2), 1, 1);
    show('s08', 0, 0, prog(t,14.05,14.18), lerp(0.88,1,p), 2);
  } else if (t < 18.2){
    push(t, 16.3, 's08', 's11');
  } else if (t < 19.85){
    push(t, 18.15, 's11', 's12');
  } else if (t < 22.2){
    fade(t, 19.85, 's12', 's13', 0.35);
    statusDark = t > 20.0;
  } else if (t < 23.75){
    push(t, 22.15, 's13', 's14');
    statusDark = t < 22.35;
  } else if (t < 25.15){
    push(t, 23.75, 's14', 's15');
  } else if (t < 26.2){
    fade(t, 25.15, 's15', 's16', 0.16);
  } else if (t < 27.7){
    fade(t, 26.15, 's16', 's17', 0.3);
  } else {
    push(t, 27.7, 's17', 's18');
  }
  $('status').style.color = statusDark ? '#F4EEDC' : '#1F2A37';

  // tap feedback
  let dotO=0, ringO=0, dotS=1, ringS=1, tx=0, ty=0;
  for (const tp of taps){
    const d = t - tp.t;
    if (d > -0.35 && d < 0.5){
      tx = tp.x*K; ty = tp.y*K;
      if (d < 0){ dotO = clamp((d+0.35)/0.15); dotS = lerp(1.25,1,clamp((d+0.35)/0.3)); }
      else { dotO = clamp(1 - d/0.3); dotS = lerp(0.85,1,clamp(d/0.2)); ringO = 0.8*(1 - clamp(d/0.5)); ringS = lerp(0.6,2.2,eOutCubic(clamp(d/0.5))); }
    }
  }
  const dot=$('tapDot'), ring=$('tapRing');
  dot.style.left=ring.style.left=tx+'px'; dot.style.top=ring.style.top=ty+'px';
  dot.style.opacity=dotO; dot.style.transform=`scale(${dotS})`;
  ring.style.opacity=ringO; ring.style.transform=`scale(${ringS})`;
}

function render(t){
  // background motion
  for (const b of blobs){ b.el.style.transform=`translate(${b.x-b.r+Math.sin(t*0.5+b.ph)*24}px,${b.y-b.r+Math.cos(t*0.42+b.ph)*30}px)`; }
  const night = clamp(prog(t,19.9,20.5)) * (1 - prog(t,22.1,22.6));
  $('night').style.opacity = 0.94*night;
  for (const s of stars){ const tw = 0.55 + 0.45*Math.sin(t*2.2 + s.ph);
    s.el.style.color = night>0.5 ? '#FFE6A3' : '#FFB020';
    s.el.style.opacity = (0.35 + 0.5*night) * tw;
    s.el.style.transform = `translateY(${Math.sin(t*0.8+s.ph)*10}px) scale(${0.8+0.4*tw})`; }

  // intro
  const io = 1 - prog(t, 1.75, 2.3);
  $('intro').style.opacity = io; $('intro').style.display = io>0 ? 'block':'none';
  $('intro').style.transform = `translateY(${-90*eInCubic(prog(t,1.75,2.3))}px)`;
  $('introIcon').style.transform = `scale(${eOutBack(prog(t,0.05,0.6))})`;
  $('introTitle').style.opacity = prog(t,0.35,0.75); $('introTitle').style.transform=`translateY(${30*(1-eOutCubic(prog(t,0.35,0.8)))}px)`;
  $('introTag').style.opacity = prog(t,0.6,1.0); $('introTag').style.transform=`translateY(${24*(1-eOutCubic(prog(t,0.6,1.05)))}px)`;

  // phone in / out
  const pin = eOutBackSoft(prog(t, 1.95, 2.8)), pout = eInCubic(prog(t, 29.55, 30.15));
  const py = lerp(1500, 0, pin) + 1500*pout;
  const prot = lerp(6, 0, pin) + 4*pout;
  $('phone').style.transform = `translateY(${py}px) rotate(${prot}deg)`;
  $('phone').style.display = (t>1.9 && t<30.2) ? 'block' : 'none';
  if (t>1.9 && t<30.2) renderScreen(Math.max(t,2.0));

  // captions
  let cap = -1; for (let i=0;i<captions.length;i++){ if (t>=captions[i].a-0.01 && t<captions[i].b+0.35) cap=i; }
  const ce = $('caption');
  if (cap>=0){ const c=captions[cap];
    if (cap!==lastCap){ $('capTitle').innerHTML=c.t; $('capSub').innerHTML=c.s; lastCap=cap; }
    const pi = prog(t,c.a,c.a+0.45), po = prog(t,c.b,c.b+0.3);
    ce.style.opacity = Math.min(pi*1.4, 1) * (1-po);
    ce.style.transform = `translateY(${36*(1-eOutCubic(pi)) - 20*po}px) scale(${lerp(0.94,1,eOutBack(pi))})`;
  } else ce.style.opacity = 0;
  const capNight = night;
  $('capTitle').style.color = capNight>0.5 ? '#FFFFFF' : '#0B3D7A';
  $('capSub').style.color = capNight>0.5 ? '#D9D3FF' : '#4B5872';

  // end card
  const eo = prog(t, 29.9, 30.2);
  $('end').style.display = eo>0 ? 'block':'none'; $('end').style.opacity = eo;
  $('endIcon').style.transform = `scale(${eOutBack(prog(t,29.95,30.55))})`;
  $('endTitle').style.opacity = prog(t,30.2,30.6); $('endTitle').style.transform=`translateY(${30*(1-eOutCubic(prog(t,30.2,30.7)))}px)`;
  $('endTag').style.opacity = prog(t,30.4,30.8); $('endTag').style.transform=`translateY(${24*(1-eOutCubic(prog(t,30.4,30.9)))}px)`;
  ['p1','p2','p3'].forEach((id,i)=>{ const p=prog(t,30.6+i*0.12,31.0+i*0.12); $(id).style.opacity=p; $(id).style.transform=`translateY(${30*(1-eOutBack(p))}px) scale(${lerp(.8,1,eOutBack(p))})`; });
  const cp = prog(t,31.0,31.45); $('cta').style.opacity=cp;
  $('cta').style.transform = `scale(${lerp(.7,1,eOutBack(cp)) * (1 + 0.025*Math.sin(Math.max(0,t-31.5)*5))})`;

  // confetti
  for (const c of bursts){ const d = t - c.t0;
    if (d < 0 || d > 2.6){ c.el.style.opacity=0; continue; }
    const x = c.ox + c.vx*d, y = c.oy + c.vy*d + 0.5*1700*d*d;
    c.el.style.opacity = 1 - clamp((d-1.8)/0.8);
    c.el.style.transform = `translate(${x}px,${y}px) rotate(${c.rot + c.vr*d}deg)`; }
}

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(()=>{})));
  render(0); return true;
})();
</script>
